# tfs-sync
# 优先级：Run 参数 > Agent 环境变量 > 本文件默认值

[tfs]
collection_env = "TFS_COLLECTION"
collection = ""
wiql = """
SELECT
   [System.Id],
   [System.WorkItemType],
   [System.Title],
   [System.AssignedTo],
   [System.State],
   [System.Tags],
   [System.CreatedDate],
   [System.ChangedDate]
FROM workitems
WHERE
   [System.WorkItemType] <> ''
   AND [System.AssignedTo] = @Me
   AND [System.State] <> '已关闭'
   AND [System.State] <> '已验证'
ORDER BY [System.Id]
"""
max_items_per_run = 200

[multica]
binary_env = "MULTICA_BIN"
binary = "multica"
project_env = "DEFAULT_PROJECT"
project = ""
project_required = true
cli_timeout_seconds = 30
read_retry_attempts = 3
read_retry_base_delay_seconds = 1
read_retry_max_delay_seconds = 8

[delivery]
# 必须精确解析为唯一 Delivery Squad；推荐直接配置 Squad UUID。
squad = "Delivery Squad"

[runtime]
work_dir = ".tmp"
stop_on_item_failure = false
retryable_item_attempts = 2
retryable_item_base_delay_seconds = 2
